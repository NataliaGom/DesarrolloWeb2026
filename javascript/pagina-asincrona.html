<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Pagina Asincrona</title>
	</head>

	<body>
		<div id="contenedor-llamada"></div>
		<script>
			function generaNodoAlumnos(alumnos) {
				const listaAl = document.createElement("ul");

				for (let i = 0; i < alumnos.length; i++) {
					const elemLista = document.createElement("li");
					elemLista.textContent =
						alumnos[i].nombre + ":   " + alumnos[i].intereses;
					listaAl.appendChild(elemLista);
				}

				return listaAl;
			}

			fetch("salon.json")
				.then((respuesta) => {
					console.log(respuesta);

					return respuesta.json();
				})
				.then((datos) => {
					console.log(datos);

					const contenedor = document.getElementById("contenedor-llamada");
					contenedor.textContent = JSON.stringify(datos);

					//crear nodos
					const nodo = document.createElement("p");
					nodo.textContent = datos.profesor.nombre;
					nodo.style.color = "green";

					console.dir(nodo);
					contenedor.appendChild(nodo); //agregar nodo al final

					//otro nodo
					const elementosDeLista1 = document.createElement("li");
					elementosDeLista1.textContent =
						datos.profesor.intereses_profesionales[0];

					const elementosDeLista2 = document.createElement("li");
					elementosDeLista2.textContent =
						datos.profesor.intereses_profesionales[1];

					const elementosDeLista3 = document.createElement("li");
					elementosDeLista3.textContent =
						datos.profesor.intereses_profesionales[2];

					const lista = document.createElement("ul");

					lista.appendChild(elementosDeLista1);
					lista.appendChild(elementosDeLista2);
					lista.appendChild(elementosDeLista3);

					contenedor.appendChild(lista);

					const listaAl = generaNodoAlumnos(datos.alumnos);
					contenedor.appendChild(listaAl);
				})
				.catch((error) => {
					console.log("Ocurrió un error al obtener los datos", error);
				});

			// const llamada = fetch("salon.json");
			// console.log(llamada);
		</script>
	</body>
</html>
