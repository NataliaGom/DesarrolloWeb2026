<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>JSON en local storage</title>
	</head>

	<body>
		<style>
			button {
				background-color: blueviolet;
			}
		</style>

		<h1>Ejemplo de local storage</h1>
		<!-- 
        <button onclick="guardarDatos()">Guardar Datos</button>
		<button onclick="muestraMensaje()">Muestra Mensaje</button>
        -->

		<input
			type="text"
			id="fullname"
			name="fullname"
			placeholder="Escribe tu nombre"
			required />
		<button onclick="guardarDatosInput()">Guardar</button>
		<button onclick="verMensaje()">Mostrar</button>

		<p id="mensaje"></p>

		<script>
			function guardarDatos() {
				localStorage.setItem("nombre", "Nat");
			}

			function muestraMensaje() {
				const nombre = localStorage.getItem("nombre");
				alert(`Hola, ${nombre}`);
			}

			function guardarDatosInput() {
				const nombre = document.getElementById("fullname").value;
				localStorage.setItem("nombre", nombre);
			}

			function verMensaje() {
				const nombre = localStorage.getItem("nombre");
				document.getElementById("mensaje").textContent = "Hola, " + nombre;
			}
		</script>
	</body>
</html>
