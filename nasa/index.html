<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>API NASA</title>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			crossorigin="anonymous" />
	</head>

	<body>
		<div id="informacion"></div>

		<script>
			function formatearImagen(datos) {
				const respuesta = `
					<div class="card" style="width: 30rem;">
						<img src="${datos.url}" 
							 class="card-img-top" 
							 alt="${datos.title}">
						<div class="card-body">
							<h5 class="card-title">${datos.title}</h5>
							<p class="card-text">${datos.explanation}</p>
							<p class="card-text">
								<small class="text-muted">Fecha: ${datos.date}</small>
							</p>
							<a href="${datos.hdurl}" 
							   class="btn btn-primary">
								Ver imagen completa 
							</a>
						</div>
					</div>
				`;
				return respuesta;
			}

			fetch(
				"https://api.nasa.gov/planetary/apod?api_key=WVwjGIKWFaVexkqugHLAzMzv0DMTFbmn0tPEQmaR",
			)
				.then((respuesta) => respuesta.json())
				.then((datos) => {
					const contenedorInformacion = document.getElementById("informacion");
					contenedorInformacion.innerHTML = formatearImagen(datos);
				})
				.catch((error) => console.error("Error al obtener imagen:", error));
		</script>
	</body>
</html>
